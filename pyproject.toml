[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-uq-model-zoo"
version = "0.4.0"
description = "Minimal conditional diffusion and flow matching with uncertainty-aware learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4.1", "monai==1.5.2", "monai-generative==0.2.3",
  "numpy>=1.24,<3", "einops>=0.7", "PyYAML>=6", "scipy>=1.10", "scikit-image>=0.21", "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
logging = ["tensorboard>=2.15"]
brats = ["nibabel>=5"]

[project.scripts]
latent-uq = "latent_uq.cli:main"

[tool.setuptools.packages.find]
include = ["latent_uq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
